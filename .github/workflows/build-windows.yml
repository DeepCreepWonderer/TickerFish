name: Build Windows exe

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 
        required: false
        default: ""
  release:
    types: [published]        

permissions:
  contents: write            

env:
  GODOT_VERSION: 4.6.2
  EXPORT_PRESET: Windows Desktop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Work out the target release tag
        id: target
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="${{ github.event.inputs.release_tag }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then
            echo "attach=yes" >> "$GITHUB_OUTPUT"
            echo "将挂到 Release: $TAG"
          else
            echo "attach=no" >> "$GITHUB_OUTPUT"
            echo "没有给 tag,只产出 artifact"
          fi

      - name: Install Godot and export templates
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project
        run: ./godot --headless --import

      - name: Regression suite
        run: ./godot --headless res://tests/regression_test.tscn

      - name: Export Windows binary
        run: |
          mkdir -p build
          ./godot --headless --export-release "$EXPORT_PRESET" build/Tickerfish.exe
          test -f build/Tickerfish.exe

      - name: Fail if any third-party art leaked into the build
        run: |
          if strings build/Tickerfish.exe | grep -qiE 'Fishes.?Sprite.?Sheet'; then
            echo "::error::Paid sprite sheet found inside the exported binary"
            exit 1
          fi
          echo "Clean: no third-party sprite sheet in the build."

      - name: Assemble payload
        run: |
          mkdir -p dist/Tickerfish/FishArt
          cp build/Tickerfish.exe          dist/Tickerfish/
          cp LICENSE                       dist/Tickerfish/
          cp THIRD-PARTY-NOTICES.md        dist/Tickerfish/
          cp README.md README.zh-CN.md     dist/Tickerfish/
          cp FISH-ART-GUIDE.md FISH-ART-GUIDE.zh-CN.md dist/Tickerfish/
          cp api_config.example.json       dist/Tickerfish/
          cp -r licenses                   dist/Tickerfish/
          cp FishArt/.gdignore             dist/Tickerfish/FishArt/

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tickerfish-windows-x86_64
          path: dist/Tickerfish/
          include-hidden-files: true 

      - name: Package and checksum
        if: steps.target.outputs.attach == 'yes'
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          cd dist
          zip -qr "Tickerfish-${TAG}-windows-x86_64.zip" Tickerfish
          sha256sum "Tickerfish-${TAG}-windows-x86_64.zip" | tee SHA256SUMS.txt


      - name: Attach to the release
        if: steps.target.outputs.attach == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.target.outputs.tag }}" \
            dist/Tickerfish-*.zip \
            dist/SHA256SUMS.txt \
            --clobber
